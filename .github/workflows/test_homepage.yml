name: React Frontend (home page) Test

on:
  push:
    branches:
      - dev
    paths:
      - 'snubaseball/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'snubaseball/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./snubaseball/yarn.lock
    - name: Run tests
      working-directory: "snubaseball"
      run: |
        yarn && CI=true
        yarn test --coverage --watchAll=false
