name: Deploy Teampage

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'baseballteam/**'

jobs:
  deploy:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    environment:
      name: teampage
      url: https://team.snubaseball.co.kr

    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          ecr: false
          logout: true

      # 3. Build the Docker image
      - name: Build Docker image
        run: |
          cd baseballteam
          docker build \
            --build-arg REACT_APP_API_URL_PROD=${{ secrets.API_URL }} \
            --build-arg NODE_ENV=production \
            -t ${{ secrets.DOCKER_REGISTRY }}/baseballteam:latest .

      # 4. Push the Docker image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_REGISTRY }}/baseballteam:latest

      # 5. SSH and deploy the server
      - name: SSH and deploy the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker stop baseballteam
            docker rm baseballteam
            docker pull ${{ secrets.DOCKER_REGISTRY }}/baseballteam:latest
            docker run -d -p 3000:80 --name baseballteam ${{ secrets.DOCKER_REGISTRY }}/baseballteam:latest
