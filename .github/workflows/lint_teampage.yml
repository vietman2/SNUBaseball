name: ESLint (team page)

on:
  push:
    branches:
      - dev
    paths:
      - 'baseballteam/**'
  pull_request:
    # The branches below must be a subset of the branches above
    branches: 
      - dev
    paths:
      - 'baseballteam/**'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "baseballteam"
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install ESLint
        run: |
          npm install eslint@9.9.1 --legacy-peer-deps
          npm install eslint-plugin-react@7.35.1 --legacy-peer-deps
          npm install @microsoft/eslint-formatter-sarif@3.1.0 --legacy-peer-deps

      - name: Run ESLint
        run: npx eslint src
          --config eslint.config.js
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: baseballteam/eslint-results.sarif
          wait-for-processing: true
