name: Pylint

on:
  pull_request:
    branches:
      - dev
    paths:
      - 'baseballserver/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    strategy:
      matrix:
        python-version: ["3.13.3"]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pipenv'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        cd baseballserver
        pipenv install --dev

    - name: Analysing the code with pylint
      run: |
        cd baseballserver
        pipenv run sh -c 'DJANGO_SETTINGS_MODULE=baseballserver.settings.local pylint --load-plugins pylint_django --rcfile=.pylintrc .'
